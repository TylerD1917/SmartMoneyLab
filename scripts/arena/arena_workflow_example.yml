# Esempio GitHub Action per l'AI Investing Arena.
# Copialo a mano in .github/workflows/arena.yml (i file workflow vanno aggiunti da te; il tuo PAT ha scope 'workflow').
# Cron settimanale -> run_period.py auto (decide da solo se è periodo di decisione o solo mark).
name: AI Investing Arena

on:
  schedule:
    - cron: "0 13 * * 1"    # ogni lunedì 13:00 UTC (mercati USA aperti da poco)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arena
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install --upgrade yfinance pandas numpy
      - name: Esegui il periodo (auto)
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOONSHOT_API_KEY:  ${{ secrets.MOONSHOT_API_KEY }}
        run: python scripts/arena/run_period.py auto
      - name: Committa stato e output pubblici
        run: |
          git config user.name "smartmoneylab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/arena/state public/tools/arena
          if git diff --staged --quiet; then
            echo "Nessuna variazione."
          else
            git commit -m "arena: aggiornamento ($(date -u +%F))"
            for i in 1 2 3 4 5; do
              git push && break
              [ "$i" = "5" ] && exit 1
              echo "push $i rifiutato, rebase e retry..."; git pull --rebase --autostash origin main; sleep 3
            done
          fi
