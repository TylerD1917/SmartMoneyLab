# AI Investing Arena: ogni lunedi' dopo la chiusura americana.
# run_period.py auto decide da solo se e' un periodo di decisione o solo di
# valorizzazione. Lo stato durevole sono gli snapshot di allocazione in
# scripts/arena/state/positions/: tutto il resto e' ricalcolato.
name: AI Investing Arena

on:
  schedule:
    - cron: "15 22 * * 1"   # lunedì 22:15 UTC: dopo la chiusura USA sia in ora legale
                            # (20:00 UTC) sia in ora solare (21:00), così prezzi e date coincidono
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arena
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install --upgrade yfinance pandas numpy

      # Il 2026-10-06 la Action e' andata a buon fine pubblicando una classifica
      # azzerata. I test girano PRIMA di toccare qualunque cosa: se il motore
      # NAV e' rotto, il job si ferma qui e il sito resta all'ultima versione buona.
      - name: Test del motore NAV e del controllo di coerenza
        run: |
          python scripts/arena/test_nav_daily.py
          python scripts/arena/test_coherence.py

      - name: Esegui il periodo (auto)
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOONSHOT_API_KEY:  ${{ secrets.MOONSHOT_API_KEY }}
        run: python scripts/arena/run_period.py auto

      # Rete di sicurezza: se per qualunque motivo arena.json uscisse con i
      # modelli fermi al capitale iniziale, non lo si committa.
      - name: Verifica l'output prima di committare
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("public/tools/arena/arena.json", encoding="utf-8"))
          cap = d["rules"]["capital"]
          fermi = [r["id"] for r in d["leaderboard"]
                   if r["type"] in ("model", "control") and abs(r["nav"] - cap) < 0.01]
          vuote = [k for k, v in d["nav"].items() if not v]
          if fermi or vuote:
              sys.exit(f"arena.json non pubblicabile: NAV fermo al capitale per {fermi}; "
                       f"curve vuote per {vuote}")
          print("arena.json ok:", ", ".join(f"{r['id']} {r['ret_total']:+.2%}"
                                            for r in d["leaderboard"]))
          PY

      - name: Committa stato e output pubblici
        run: |
          git config user.name "smartmoneylab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/arena/state public/tools/arena
          if git diff --staged --quiet; then
            echo "Nessuna variazione."
          else
            git commit -m "arena: aggiornamento ($(date -u +%F))"
            for i in 1 2 3 4 5; do
              git push && break
              [ "$i" = "5" ] && exit 1
              echo "push $i rifiutato, rebase e retry..."; git pull --rebase --autostash origin main; sleep 3
            done
          fi
